name: Sync Star Token

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-star-token
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Create deployment configuration
        run: node scripts/create-wrangler-config.mjs
        env:
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
      - name: Sync Worker secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami
          secrets: GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN }}
